[pytest]
# Chạy từ thư mục gốc: config.py, pages/, utils/... import trực tiếp.
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    core: unit test của framework (không mở browser, không cần mạng)
    e2e: UI test bằng Selenium WebDriver trên Chrome
    smoke: bộ kiểm tra nhanh (từ tag @smoke trong dữ liệu)
    role(user): chạy với phiên đăng nhập sẵn của user, vd role("standard_user")
