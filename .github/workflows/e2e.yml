# Chạy bộ test E2E trên https://www.saucedemo.com mỗi khi push / mở PR vào main.
# Có thể chạy tay: tab Actions -> "E2E saucedemo" -> Run workflow (chọn nhóm test theo marker).
#
# Cần khai báo 1 secret (Settings -> Secrets and variables -> Actions):
#   SAUCE_PASSWORD  (mật khẩu chung hiển thị ở trang login saucedemo)
# Thiếu secret thì các test cần đăng nhập tự skip, phần còn lại vẫn chạy.
name: E2E saucedemo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      marker:
        description: 'Biểu thức marker pytest (vd: smoke, e2e, "e2e and not smoke")'
        required: false
        default: ""

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_ENV: prod
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      MARKER: ${{ github.event.inputs.marker }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài dependency
        run: python -m pip install -r requirements.txt

      - name: Kiểm tra dữ liệu + thu thập test
        run: python -m pytest --collect-only -q ${MARKER:+-m "$MARKER"}

      - name: Chạy test trên https://www.saucedemo.com
        run: python -m pytest -n 4 ${MARKER:+-m "$MARKER"}

      - name: Tóm tắt kết quả
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml = Path("artifacts/prod/junit/results.xml")
          if not xml.exists():
              print("Không có file JUnit (test chưa chạy)."); raise SystemExit
          suite = ET.parse(xml).getroot().find("testsuite")
          total, fail, err, skip = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
          print("## E2E saucedemo\n")
          print("| Tổng | Pass | Fail | Error | Skip/xfail |\n|---|---|---|---|---|")
          print(f"| {total} | {total - fail - err - skip} | {fail} | {err} | {skip} |\n")
          failed = [tc for tc in suite.iter("testcase") if tc.find("failure") is not None or tc.find("error") is not None]
          if failed:
              print("### Test thất bại\n")
              for tc in failed[:50]:
                  print(f"- `{tc.get('classname')}::{tc.get('name')}`")
          PY

      - name: Lưu báo cáo (JUnit, Allure, log, ảnh, page source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_number }}
          path: artifacts/prod/
          retention-days: 14
          if-no-files-found: ignore
